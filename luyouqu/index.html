/* 版面：上面一段說明，中間 5 支直式影片橫排（電腦一次看完、手機左右滑），下面一塊「選好了怎麼回」 */
:root{
  --bg:#f3f4f1; --card:#ffffff; --ink:#1b1f1c; --mute:#626a64; --line:#dde1db;
  --acc:#1f6b57; --accsoft:#e2efe9; --onacc:#ffffff;
  --f:"Noto Sans TC",-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  --fl:"Space Grotesk","Noto Sans TC",-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#131614; --card:#1c201d; --ink:#edf0ec; --mute:#9aa29c; --line:#2f3530;
  --acc:#4fc29f; --accsoft:#1b3229; --onacc:#0d1a15; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131614; --card:#1c201d; --ink:#edf0ec; --mute:#9aa29c; --line:#2f3530;
  --acc:#4fc29f; --accsoft:#1b3229; --onacc:#0d1a15; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.65}
.wrap{max-width:1180px;margin:0 auto;padding-block:32px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:24px}
.brand{margin:0 0 18px}
.logo{height:44px;width:auto;display:block}
.logo-light-ink{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo-dark-ink{display:none}:root:not([data-theme="light"]) .logo-light-ink{display:block}}
:root[data-theme="dark"] .logo-dark-ink{display:none}
:root[data-theme="dark"] .logo-light-ink{display:block}
.eyebrow{font-size:13px;letter-spacing:.12em;color:var(--acc);font-weight:700;margin:0}
h1{font-size:clamp(26px,4.4vw,40px);line-height:1.25;margin:4px 0 0;font-weight:900;text-wrap:balance}
.intro{color:var(--mute);margin:8px 0 0;max-width:38em}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:99px;padding:6px 14px;cursor:pointer;display:flex;gap:8px;align-items:center;
  transition:background .2s ease,color .2s ease,border-color .2s ease}
.chip b{font-family:var(--fl);font-weight:700}
.chip[aria-current="true"]{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.chip:focus-visible,video:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.track{display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - 4*16px)/5);gap:16px;
  overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;padding-bottom:6px;scrollbar-width:thin}
.item{scroll-snap-align:start;display:flex;flex-direction:column;gap:10px;min-width:0}
.frame{position:relative;aspect-ratio:9/16;max-width:100%;border-radius:14px;overflow:hidden;background:#000;
  border:2px solid transparent;transition:border-color .2s ease,transform .2s ease}
.item.on .frame{border-color:var(--acc)}
.frame video{width:100%;height:100%;display:block;object-fit:cover;background:#000}
.name{display:flex;gap:10px;align-items:baseline}
.name b{font-family:var(--fl);font-size:22px;color:var(--acc);line-height:1}
.name span{font-weight:700;font-size:17px}
.desc{margin:0;color:var(--mute);font-size:15px;line-height:1.6}
.reply{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 22px;
  display:flex;flex-direction:column;gap:6px;max-width:640px}
.reply h2{margin:0;font-size:20px}
.reply p{margin:0;color:var(--mute)}
.reply .ex{color:var(--ink);font-weight:500}
.foot{color:var(--mute);font-size:13px;margin:0}
@media (max-width:760px){
  .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-right:calc(-1*max(16px,env(safe-area-inset-right,0px)));padding-right:16px}
  .chip{flex:none}
  .track{grid-auto-columns:76%;margin-right:calc(-1*max(16px,env(safe-area-inset-right,0px)))}
}
@media (prefers-reduced-motion:reduce){.track{scroll-behavior:auto}.chip,.frame{transition:none}}
</style>

<script type="application/json" id="cfg">{"eyebrow": "5 版包裝・免費活動", "heading": "露遊趣｜充氣帳氣嘴，5 種包裝", "intro": "同一段影片，剪成 5 種包裝，每支 40 秒。內容都一樣，只差字卡樣式。看完在 LINE 回我最喜歡的字母（A 到 E）。建議開聲音看。", "replyTitle": "喜歡哪一版？", "replyText": "在 LINE 回我 A 到 E 其中一個字母就好。", "replyEx": "例如：「我選 C」", "foot": "Sam在嗎 製作", "styles": [{"letter": "A", "name": "綠色色塊標題", "desc": "上方綠色色塊，放品牌和黃色大標題。", "video": "v/a.mp4", "poster": "p/a.jpg"}, {"letter": "B", "name": "白卡重點", "desc": "白色圓角卡，紅色小標配黑色大字。", "video": "v/b.mp4", "poster": "p/b.jpg"}, {"letter": "C", "name": "紀錄片名牌", "desc": "半透明黑底名牌，左邊紅條、金色大字。", "video": "v/c.mp4", "poster": "p/c.jpg"}, {"letter": "D", "name": "頂部小標籤", "desc": "畫面上方一條小標籤，每段換一句重點。", "video": "v/d.mp4", "poster": "p/d.jpg"}, {"letter": "E", "name": "紅底黃字", "desc": "紅底黃色大字標題，配黑底小標。", "video": "v/e.mp4", "poster": "p/e.jpg"}]}</script>
<script>
(function(){
  var cfg = JSON.parse(document.getElementById('cfg').textContent);
  function $(id){return document.getElementById(id)}
  $('eyebrow').textContent = cfg.eyebrow;
  $('h1').textContent = cfg.heading;
  $('intro').textContent = cfg.intro;
  $('replyTitle').textContent = cfg.replyTitle;
  $('replyText').textContent = cfg.replyText;
  $('replyEx').textContent = cfg.replyEx;
  $('foot').textContent = cfg.foot;

  var chips = $('chips'), track = $('track'), items = [], chipEls = [];
  cfg.styles.forEach(function(s, i){
    var c = document.createElement('button');
    c.className = 'chip'; c.type = 'button'; c.id = 'chip-' + s.letter;
    c.innerHTML = '<b></b><span></span>';
    c.querySelector('b').textContent = s.letter;
    c.querySelector('span').textContent = s.name;
    c.addEventListener('click', function(){ go(i, true) });
    chips.appendChild(c); chipEls.push(c);

    var it = document.createElement('article');
    it.className = 'item'; it.id = 'style-' + s.letter.toLowerCase();
    it.innerHTML = '<div class="frame"><video controls playsinline preload="metadata"></video></div>' +
      '<div class="name"><b></b><span></span></div><p class="desc"></p>';
    var v = it.querySelector('video');
    v.src = s.video; v.poster = s.poster; v.setAttribute('aria-label', s.letter + ' ' + s.name);
    it.querySelector('.name b').textContent = s.letter;
    it.querySelector('.name span').textContent = s.name;
    it.querySelector('.desc').textContent = s.desc;
    v.addEventListener('play', function(){
      items.forEach(function(o){ var ov = o.querySelector('video'); if (ov !== v && !ov.paused) ov.pause(); });
      mark(i);
    });
    track.appendChild(it); items.push(it);
  });

  function mark(i){
    chipEls.forEach(function(c, k){ c.setAttribute('aria-current', k === i ? 'true' : 'false') });
    items.forEach(function(it, k){ it.classList.toggle('on', k === i) });
    if (chips.scrollWidth > chips.clientWidth + 4) {
      var c = chipEls[i], cl = c.getBoundingClientRect().left - chips.getBoundingClientRect().left + chips.scrollLeft;
      chips.scrollTo({left: Math.max(0, cl - 16), behavior: 'smooth'});
    }
  }
  var lockUntil = 0;
  function go(i, scroll){
    mark(i);
    if (!scroll || track.scrollWidth <= track.clientWidth + 4) return;
    lockUntil = Date.now() + 900;
    var left = items[i].getBoundingClientRect().left - track.getBoundingClientRect().left + track.scrollLeft;
    var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    track.scrollTo({left: left, behavior: reduce ? 'auto' : 'smooth'});
  }
  // 手機左右滑時，上面的字母跟著亮（點字母捲動的那一段不算）
  var t = null;
  track.addEventListener('scroll', function(){
    clearTimeout(t);
    if (Date.now() < lockUntil) return;
    t = setTimeout(function(){
      if (track.scrollWidth <= track.clientWidth + 4) return;
      var best = 0, bd = 1e9, tl = track.getBoundingClientRect().left;
      items.forEach(function(it, k){
        var d = Math.abs(it.getBoundingClientRect().left - tl);
        if (d < bd){ bd = d; best = k }
      });
      mark(best);
    }, 80);
  }, {passive:true});
  mark(0);
})();
</script>
</body></html>

:root{
  --ink:#191816; --panel:#232321; --panel2:#2b2b29; --line:#3e3d3a;
  --txt:#c9c5bc; --dim:#8e8a80; --white:#faf8f2; --mark:#ffd60a; --onmark:#191816;
  --display:"SamSpring","Noto Serif TC","PingFang TC",serif;
  --body:"Noto Sans TC",-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  --ease:cubic-bezier(.2,.7,.2,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--ink);color:var(--txt);font-family:var(--body);font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased}
.wrap{max-width:1200px;margin:0 auto;padding-block:24px 64px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:32px}

.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-bottom:20px;border-bottom:1px solid var(--line)}
.top img{height:36px;width:auto;display:block}
.top .tag{font-size:14px;color:var(--dim);letter-spacing:.04em}

.hero{display:flex;flex-direction:column;gap:16px;max-width:820px}
.client{align-self:flex-start;background:var(--mark);color:var(--onmark);font-family:var(--display);font-weight:900;
  font-size:20px;line-height:1;padding:10px 16px 11px;border-radius:10px;transform:rotate(-4deg);margin:4px 0 4px 4px}
h1{margin:0;font-family:var(--display);font-weight:900;color:var(--white);font-size:clamp(32px,5.6vw,56px);line-height:1.2;letter-spacing:.01em;text-wrap:balance}
h1 mark{background:linear-gradient(transparent 58%,var(--mark) 58%,var(--mark) 92%,transparent 92%);color:inherit;padding:0 .08em}
.intro{margin:0;font-size:17px;max-width:36em}
.intro b{color:var(--white);font-weight:500}

.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--panel);color:var(--txt);
  border-radius:10px;padding:6px 12px 6px 6px;cursor:pointer;display:flex;gap:8px;align-items:center;
  transition:background-color .2s var(--ease),color .2s var(--ease),border-color .2s var(--ease)}
.chip b{display:grid;place-items:center;width:26px;height:26px;border-radius:7px;background:var(--panel2);color:var(--mark);
  font-family:var(--display);font-weight:900;font-size:15px;transition:background-color .2s var(--ease),color .2s var(--ease)}
.chip:hover{border-color:var(--dim)}
.chip[aria-current="true"]{border-color:var(--mark);color:var(--white)}
.chip[aria-current="true"] b{background:var(--mark);color:var(--onmark)}
.chip:focus-visible,video:focus-visible{outline:2px solid var(--mark);outline-offset:3px}

.track{display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - 4*16px)/5);gap:16px;
  overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;padding:12px 4px 8px;margin:-12px -4px 0;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.item{scroll-snap-align:start;display:flex;flex-direction:column;gap:12px;min-width:0;background:var(--panel);
  border:1px solid var(--line);border-radius:16px;padding:8px 8px 16px;transition:border-color .2s var(--ease)}
.item.on{border-color:var(--mark)}
.frame{position:relative;aspect-ratio:9/16;max-width:100%;border-radius:10px;overflow:visible}
.frame video{width:100%;height:100%;display:block;object-fit:cover;background:#000;border-radius:10px}
.letter{position:absolute;top:-10px;left:-6px;z-index:2;background:var(--mark);color:var(--onmark);font-family:var(--display);
  font-weight:900;font-size:22px;line-height:1;padding:7px 11px 8px;border-radius:8px;transform:rotate(-4deg);pointer-events:none}
.meta{padding:0 6px;display:flex;flex-direction:column;gap:4px}
.name{margin:0;font-family:var(--display);font-weight:900;color:var(--white);font-size:19px;line-height:1.35}
.desc{margin:0;color:var(--txt);font-size:15px;line-height:1.6}

.reply{background:var(--mark);color:var(--onmark);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:8px;max-width:640px}
.reply h2{margin:0;font-family:var(--display);font-weight:900;font-size:28px;line-height:1.25}
.reply p{margin:0;font-size:17px}
.reply .ex{align-self:flex-start;background:var(--onmark);color:var(--white);border-radius:10px;padding:6px 12px;font-size:15px;margin-top:4px}
.foot{display:flex;align-items:center;gap:12px;color:var(--dim);font-size:13px;margin:0}
.foot img{height:20px;width:auto;opacity:.7}

@media (max-width:760px){
  .wrap{gap:28px}
  .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-right:calc(-1*max(16px,env(safe-area-inset-right,0px)));padding-right:16px}
  .chip{flex:none}
  /* 11/19 Sam「直式瀏覽影片太大了」：手機一畫面看到 2 支＋第 3 支露一點 */
  .track{grid-auto-columns:44%;gap:12px;margin-right:calc(-1*max(16px,env(safe-area-inset-right,0px)))}
  .item{padding:6px 6px 12px;gap:8px;border-radius:14px}
  .letter{font-size:17px;padding:5px 8px 6px}
  .name{font-size:16px}
  .desc{font-size:14px;line-height:1.5}
  .reply{padding:20px}
}
@media (prefers-reduced-motion:reduce){.track{scroll-behavior:auto}.chip,.chip b,.item{transition:none}}
</style>

<script type="application/json" id="cfg">{"eyebrow": "5 版包裝・免費活動", "client": "柚柚", "heading": "曬黑的秘密，【5 種包裝】", "intro": "同一段影片，剪成 5 種包裝，每支約 17 秒。內容都一樣，只差字卡、字幕樣式和配樂。看完在 LINE 回我最喜歡的字母（A 到 E）。建議開聲音看。", "replyTitle": "喜歡哪一版？", "replyText": "在 LINE 回我 A 到 E 其中一個字母就好。", "replyEx": "例如：「我選 C」", "foot": "Sam在嗎 製作", "styles": [{"letter": "A", "name": "黑底黃框標題", "desc": "上方黑底黃框問句，重點字放大變黃色。", "video": "v/a.mp4", "poster": "p/a.jpg"}, {"letter": "B", "name": "白色成分小卡", "desc": "講到成分時滑出白色小卡，藍色重點字。", "video": "v/b.mp4", "poster": "p/b.jpg"}, {"letter": "C", "name": "奶茶色筆記卡", "desc": "米色圓角標題卡，粉色重點字，輕快吉他配樂。", "video": "v/c.mp4", "poster": "p/c.jpg"}, {"letter": "D", "name": "電影感名牌", "desc": "上下黑邊，左下金色名牌，鋼琴配樂。", "video": "v/d.mp4", "poster": "p/d.jpg"}, {"letter": "E", "name": "手寫筆記紙", "desc": "講到重點時貼上一張手寫筆記，螢光筆畫重點。", "video": "v/e.mp4", "poster": "p/e.jpg"}]}</script>
<script>
(function(){
  var cfg = JSON.parse(document.getElementById('cfg').textContent);
  function $(id){return document.getElementById(id)}
  function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}
  // 【】包住的字畫黃條
  function marked(s){return esc(s).replace(/【(.+?)】/g,'<mark>$1</mark>')}
  $('eyebrow').textContent = cfg.eyebrow;
  $('client').textContent = cfg.client;
  $('h1').innerHTML = marked(cfg.heading);
  $('intro').innerHTML = esc(cfg.intro).replace(/（A 到 E）/, '<b>（A 到 E）</b>');
  $('replyTitle').textContent = cfg.replyTitle;
  $('replyText').textContent = cfg.replyText;
  $('replyEx').textContent = cfg.replyEx;
  $('foot').textContent = cfg.foot;

  var chips = $('chips'), track = $('track'), items = [], chipEls = [];
  cfg.styles.forEach(function(s, i){
    var c = document.createElement('button');
    c.className = 'chip'; c.type = 'button'; c.id = 'chip-' + s.letter;
    c.innerHTML = '<b></b><span></span>';
    c.querySelector('b').textContent = s.letter;
    c.querySelector('span').textContent = s.name;
    c.addEventListener('click', function(){ go(i, true) });
    chips.appendChild(c); chipEls.push(c);

    var it = document.createElement('article');
    it.className = 'item'; it.id = 'style-' + s.letter.toLowerCase();
    it.innerHTML = '<div class="frame"><span class="letter"></span><video controls playsinline preload="metadata"></video></div>' +
      '<div class="meta"><h3 class="name"></h3><p class="desc"></p></div>';
    var v = it.querySelector('video');
    v.src = s.video; v.poster = s.poster; v.setAttribute('aria-label', s.letter + ' ' + s.name);
    it.querySelector('.letter').textContent = s.letter;
    it.querySelector('.name').textContent = s.name;
    it.querySelector('.desc').textContent = s.desc;
    v.addEventListener('play', function(){
      items.forEach(function(o){ var ov = o.querySelector('video'); if (ov !== v && !ov.paused) ov.pause(); });
      mark(i);
    });
    track.appendChild(it); items.push(it);
  });

  function mark(i){
    chipEls.forEach(function(c, k){ c.setAttribute('aria-current', k === i ? 'true' : 'false') });
    items.forEach(function(it, k){ it.classList.toggle('on', k === i) });
    if (chips.scrollWidth > chips.clientWidth + 4) {
      var c = chipEls[i], cl = c.getBoundingClientRect().left - chips.getBoundingClientRect().left + chips.scrollLeft;
      chips.scrollTo({left: Math.max(0, cl - 16), behavior: 'smooth'});
    }
  }
  var lockUntil = 0;
  function go(i, scroll){
    mark(i);
    if (!scroll || track.scrollWidth <= track.clientWidth + 4) return;
    lockUntil = Date.now() + 900;
    var left = items[i].getBoundingClientRect().left - track.getBoundingClientRect().left + track.scrollLeft - 4;
    var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    track.scrollTo({left: left, behavior: reduce ? 'auto' : 'smooth'});
  }
  // 手機左右滑時，上面的字母跟著亮（點字母捲動的那一段不算）
  var t = null;
  track.addEventListener('scroll', function(){
    clearTimeout(t);
    if (Date.now() < lockUntil) return;
    t = setTimeout(function(){
      if (track.scrollWidth <= track.clientWidth + 4) return;
      var best = 0, bd = 1e9, tl = track.getBoundingClientRect().left;
      items.forEach(function(it, k){
        var d = Math.abs(it.getBoundingClientRect().left - tl);
        if (d < bd){ bd = d; best = k }
      });
      mark(best);
    }, 80);
  }, {passive:true});
  mark(0);
})();
</script>
